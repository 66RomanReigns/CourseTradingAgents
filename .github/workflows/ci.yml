name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Create locked environment
        run: make sync PYPI_INDEX=https://pypi.org/simple

      - name: Run offline test and lint suite
        run: make check

      - name: Run no-network Doctor
        run: make doctor

      - name: Validate API budget
        run: make api-budget

      - name: Validate Compose configuration
        run: |
          cat >/tmp/tradinglab.keys <<'EOF'
          TWELVE_DATA_API_KEY=ci-placeholder
          ALPHA_VANTAGE_API_KEY=ci-placeholder
          FRED_API_KEY=ci-placeholder
          SEC_USER_AGENT=TradeLab-CI ci@example.invalid
          GOOGLE_API_KEY=ci-placeholder
          ZHIPU_API_KEY=ci-placeholder
          ZHIPU_BASE_URL=https://example.invalid
          ZHIPU_MODEL=ci-placeholder
          TRADINGLAB_API_TOKEN=ci-placeholder
          EOF
          chmod 600 /tmp/tradinglab.keys
          TRADINGLAB_KEYS_FILE=/tmp/tradinglab.keys docker compose config --quiet
