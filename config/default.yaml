project:
  name: TradeLab-Agent
  mode: offline
  seed: 42
  timezone: America/New_York
  artifacts_dir: artifacts

data:
  provider: local_csv
  data_dir: data/sample
  cache_dir: artifacts/cache
  benchmark: SPY
  minimum_history_days: 80
  allow_network: false
  strict_as_of_filter: true

features:
  return_windows: [1, 5, 20]
  sma_windows: [20, 60]
  rsi_window: 14
  atr_window: 14
  volatility_window: 20
  drawdown_window: 60
  relative_strength_window: 20

agents:
  quant:
    enabled: true
    weights:
      trend: 0.30
      momentum: 0.25
      relative_strength: 0.20
      volume: 0.15
      volatility_penalty: 0.10
  context:
    enabled: false
    provider: mock
    model: mock-context-v1
    temperature: 0.0
    require_evidence_ids: true
  critic:
    enabled: false
    provider: mock
    model: mock-critic-v1
    veto_on_invalid_evidence: true
  fusion:
    quant_weight: 0.70
    context_weight: 0.30
    buy_threshold: 0.35
    sell_threshold: -0.35
    conflict_penalty: 0.60

risk:
  max_position_weight: 0.20
  max_trade_weight: 0.10
  min_cash_weight: 0.10
  annual_risk_budget: 0.03
  max_daily_turnover: 0.25
  stop_loss_atr_multiple: 2.0
  max_portfolio_drawdown: 0.15
  allow_short: false
  stale_data_action: HOLD

broker:
  initial_cash: 100000.0
  commission_rate: 0.0005
  minimum_commission: 1.0
  slippage_bps: 5
  signal_at: close
  execute_at: next_open
  fractional_shares: false

backtest:
  rebalance_frequency: daily
  warmup_days: 80
  metrics:
    - cumulative_return
    - annualized_return
    - annualized_volatility
    - sharpe
    - sortino
    - max_drawdown
    - calmar
    - win_rate
    - turnover
  baselines:
    - buy_and_hold
    - sma_cross
    - rsi_mean_reversion

storage:
  database_url: sqlite:///artifacts/tradinglab.db
  save_trace: true
  save_manifest: true
  save_evidence_pack: true

api:
  host: 0.0.0.0
  port: 8000
  enable_real_broker: false
