[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradinglab-agents"
version = "0.1.0"
description = "A reproducible, course-oriented multi-agent paper trading system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tradinglab = "tradinglab_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
